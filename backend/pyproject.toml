# =============================================================================
# IntelliFlow AI — pyproject.toml
#
# Centralised configuration for all Python tooling.
# Tool configs live here instead of scattered config files.
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
# Checked rule sets: pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP)
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",   # Line too long — handled by Black
    "B008",   # Function calls in default arguments (FastAPI's Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -----------------------------------------------------------------------------
# Black — code formatter
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | alembic/versions
)/
'''

# -----------------------------------------------------------------------------
# isort — import ordering (kept for pre-commit hooks; Ruff handles it in CI)
# -----------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
skip_glob = ["alembic/versions/*"]

# -----------------------------------------------------------------------------
# mypy — static type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# Allow untyped decorators from third-party libs (FastAPI, SQLAlchemy)
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = ["alembic/versions/"]

# -----------------------------------------------------------------------------
# pytest — test runner configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

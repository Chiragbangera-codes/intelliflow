# =============================================================================
# Alembic Configuration — IntelliFlow AI
#
# The DATABASE_SYNC_URL is overridden in alembic/env.py from Settings,
# so the sqlalchemy.url value below is only a placeholder.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder — actual URL is set in env.py from Settings
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration for Alembic output
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
